<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taiwan Guidebook</title>
  <meta name="description" content="Offline guide to Taiwan: places, phrases, tips and a trip log.">
  <meta name="theme-color" content="#0f5f5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taiwan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a href="#/explore" class="brand" id="brand">Taiwan Guidebook</a>
    <div class="actions">
      <span id="net-status" class="net" hidden>Offline</span>
      <button id="lang-toggle" class="btn small" type="button" aria-label="Language">中文</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/explore" data-tab="explore"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2 5.2-5.2 2 2-5.2z"/></svg></span><span data-label>Explore</span></a>
    <a href="#/log" data-tab="log"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M3 8h4M3 12h4M3 16h4"/><path d="M18.4 2.6a1.6 1.6 0 0 1 2.3 2.3L13.3 12.3l-3 .8.8-3z"/></svg></span><span data-label>My trip</span></a>
    <a href="#/ask" data-tab="ask"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/><path d="M12 8.2l1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1z"/></svg></span><span data-label>Ask AI</span></a>
    <a href="#/phrases" data-tab="phrases"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 2.5V4M2.5 5.5h10M10.5 5.5C9.8 9 7.6 12 3 13.5M4.5 5.5C5.2 9 7.4 12 12 13.5"/><path d="M13 21.5l4.5-10 4.5 10M14.6 18h5.8"/></svg></span><span data-label>Phrases</span></a>
    <a href="#/tips" data-tab="tips"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0-3.6 10.8c.9.7 1.1 1.4 1.1 2.4v.8h5v-.8c0-1 .2-1.7 1.1-2.4A6 6 0 0 0 12 3z"/><path d="M10 20.5h4"/></svg></span><span data-label>Tips</span></a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span class="sheet-title" id="sheet-title"></span>
        <button class="btn small" data-action="close-sheet" aria-label="Close">✕</button>
      </div>
      <div class="sheet-body"></div>
    </div>
  </div>
  <div id="bigcard" class="bigcard" hidden role="dialog" aria-modal="true"></div>
  <button id="askbar" class="askbar" type="button" hidden></button>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
