<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taiwan Guidebook</title>
  <meta name="description" content="Offline guide to Taiwan: places, phrases, tips and a trip log.">
  <meta name="theme-color" content="#0f5f5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taiwan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a href="#/explore" class="brand" id="brand">Taiwan Guidebook</a>
    <div class="actions">
      <span id="net-status" class="net" hidden>Offline</span>
      <button id="lang-toggle" class="btn small" type="button" aria-label="中文: switch to Chinese">中文</button>
    </div>
  </header>

  <main id="view" class="view">
    <p class="muted" data-loading>Loading…</p>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/explore" data-tab="explore"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2 5.2-5.2 2 2-5.2z"/></svg></span><span data-label>Explore</span></a>
    <a href="#/log" data-tab="log"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M3 8h4M3 12h4M3 16h4"/><path d="M18.4 2.6a1.6 1.6 0 0 1 2.3 2.3L13.3 12.3l-3 .8.8-3z"/></svg></span><span data-label>My trip</span></a>
    <a href="#/ask" data-tab="ask"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/><path d="M12 8.2l1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1z"/></svg></span><span data-label>Ask AI</span></a>
    <a href="#/phrases" data-tab="phrases"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 2.5V4M2.5 5.5h10M10.5 5.5C9.8 9 7.6 12 3 13.5M4.5 5.5C5.2 9 7.4 12 12 13.5"/><path d="M13 21.5l4.5-10 4.5 10M14.6 18h5.8"/></svg></span><span data-label>Phrases</span></a>
    <a href="#/tips" data-tab="tips"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0-3.6 10.8c.9.7 1.1 1.4 1.1 2.4v.8h5v-.8c0-1 .2-1.7 1.1-2.4A6 6 0 0 0 12 3z"/><path d="M10 20.5h4"/></svg></span><span data-label>Tips</span></a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span class="sheet-title" id="sheet-title"></span>
        <button class="btn small" type="button" data-action="close-sheet" aria-label="Close">✕</button>
      </div>
      <div class="sheet-body"></div>
      <div class="sr-status" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>
  <div id="bigcard" class="bigcard" hidden role="dialog" aria-modal="true" aria-label="Large text to show"></div>
  <button id="askbar" class="askbar" type="button" hidden></button>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="announce" class="sr-status" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
  // Boot watchdog: a classic script, so it runs even when a module fails to load or throws. Until main.js marks
  // #view with data-started (after its first render), a script error, or #view still showing the loading line
  // (data-loading) 8 seconds on, puts "The app didn't start" and a Repair button in #view. Loading goes on: when
  // the app renders, its page replaces the message, so a slow first load is not cut off. Repair unregisters this
  // page's service worker, deletes the app's caches (tg-*) and reloads. That removes the only offline copy, so
  // while the browser is offline (navigator.onLine false) the button is a line saying Repair needs a connection,
  // and the button comes back on 'online'. Its three strings are copies of bootFail, bootRepair and bootOffline in
  // lang.js, which may not have loaded (tests/core/boot-watchdog.test.js keeps them equal).
  (function () {
    var WAIT = 8000;
    var view = document.getElementById('view');
    var lang = null;
    try { lang = JSON.parse(localStorage.getItem('tg.lang.v1')); } catch (e) {}
    if (lang !== 'en' && lang !== 'zh_TW') lang = /^zh/i.test(navigator.language || '') ? 'zh_TW' : 'en';
    var text = lang === 'zh_TW'
      ? ['App 沒有順利啟動。', '修復', '修復需要網路連線，連上網路後會出現在這裡。']
      : ["The app didn't start.", 'Repair', 'Repair needs an internet connection. It appears here once you are online.'];

    function started() { return view.hasAttribute('data-started'); }
    function loading() { return !!view.querySelector('[data-loading]'); }
    function offline() { return navigator.onLine === false; }

    // The message, with Repair, or offline the line that stands in for it
    function draw() {
      view.innerHTML = '<div lang="' + (lang === 'zh_TW' ? 'zh-Hant-TW' : 'en') + '"><p>' + text[0] + '</p>'
        + (offline() ? '<p class="muted" id="boot-offline">' + text[2] + '</p>'
          : '<button type="button" class="btn primary" id="boot-repair">' + text[1] + '</button>') + '</div>';
      var button = document.getElementById('boot-repair');
      if (button) button.addEventListener('click', repair);
    }

    function show() {
      if (started() || !loading()) return;
      draw();
      var say = document.getElementById('announce');
      if (say) say.textContent = text[0];
    }

    // The connection came or went while the message is up: swap Repair and the offline line (not during a repair)
    function net() {
      if (started()) return;
      var button = document.getElementById('boot-repair');
      if (offline() ? button && !button.disabled : document.getElementById('boot-offline')) draw();
    }
    window.addEventListener('online', net);
    window.addEventListener('offline', net);

    function repair() {
      if (offline()) { draw(); return; } // no clean-up: it would leave nothing to load until the phone is online
      document.getElementById('boot-repair').disabled = true;
      var quiet = function () {};
      var jobs = [];
      if (navigator.serviceWorker) {
        jobs.push(navigator.serviceWorker.getRegistration()
          .then(function (r) { return r && r.unregister(); }).catch(quiet));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf('tg-') === 0; })
            .map(function (k) { return caches.delete(k); }));
        }).catch(quiet));
      }
      Promise.all(jobs).then(function () { location.reload(); });
    }

    // A script that fails to load or throws, or a promise nobody catches; a broken image or stylesheet is no reason
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t !== window && t.tagName !== 'SCRIPT') return;
      show();
    }, true);
    window.addEventListener('unhandledrejection', show);

    // Look again every 8 seconds: main.js puts its own loading line back when it starts after the message is up.
    // Stop once the app has started, or #view shows neither the loading line nor this message (an older main.js).
    function tick() {
      if (started() || !(loading() || document.getElementById('boot-repair') || document.getElementById('boot-offline'))) return;
      show();
      setTimeout(tick, WAIT);
    }
    setTimeout(tick, WAIT);
  })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
